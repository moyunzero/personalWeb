  </defs>
  <g clip-path="url(#tiptap-disk)" fill="#FFFFFF">
    <rect x="4" y="5.5" width="32" height="3.6" rx="1.8" />
    <rect x="4" y="11.7" width="32" height="3.6" rx="1.8" />
    <rect x="4" y="17.9" width="32" height="4.2" rx="2.1" />
    <rect x="4" y="24.7" width="32" height="3.6" rx="1.8" />
    <rect x="4" y="30.9" width="32" height="3.6" rx="1.8" />
  </g>
</svg>
